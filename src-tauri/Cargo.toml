[package]
name = "mindmap-tauri"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
regex = "1.11.1"
rfd = "0.15"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.6.0", features = [] }
uuid = { version = "1.18.1", features = ["v4"] }
